name: Demo App E2E

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    name: Demo App Playwright Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Demo App test
        run: npx playwright test tests/demo-app-tests/MainTest.spec.ts --project=chromium

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Generate report timestamp
        if: always()
        id: timestamp
        run: |
          echo "value=$(TZ=Europe/Dublin date +'%Y-%m-%d_%H-%M')" >> "$GITHUB_OUTPUT"

      - name: Publish Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          destination_dir: reports/${{ steps.timestamp.outputs.value }}
          keep_files: true

      - name: Add test reports to job summary
        if: always()
        run: |
          echo "## 📬 Test Reports" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Report | Link |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📌 Allure | [Open Report](https://irinashestopal.github.io/playwright-automation/reports/${{ steps.timestamp.outputs.value }}/) |" >> "$GITHUB_STEP_SUMMARY"